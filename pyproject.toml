[project]
name = "livith-ops-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "certifi>=2026.7.22",
    "langfuse>=4.15.6",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "mcp>=2,<3",
    "ollama>=0.6.2",
    "pydantic>=2,<3",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
